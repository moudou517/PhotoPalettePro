plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.photopalettepro'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.photopalettepro"
        minSdk 26
        targetSdk 35

        // 准备发版版本号
        versionCode 6
        versionName "3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        resConfigs "zh", "en"
    }

    signingConfigs {
        release {
            storeFile file("E:/key/photokey.p12")
            storePassword "123456"
            keyAlias "photokey"
            keyPassword "chg20050517"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true      // 开启混淆，保护核心算法
            shrinkResources true    // 移除无用资源
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // 调试模式也使用正式签名，方便测试所有功能
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        // 使用 Java 17 以匹配最新的 Android SDK 和库
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests {
            // 允许 Robolectric 以真实 Skia 渲染管线跑 Canvas 代码，用于校验 Zine 渲染结果
            includeAndroidResources = true
        }
    }
}

dependencies {
    // 基础支持库
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // 导航库：使用 2.7.7 获得优秀的 Java 兼容性
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // 界面刷新支持（主界面 activity_main.xml 中用到的下拉刷新组件）
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // 翻页切换：海报模式 / Zine 明信片模式
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // 摄影与图像核心库
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation 'androidx.palette:palette:1.0.0'

    // Room 数据库持久化（纯 Java 高效版，剔除了无用的 room-ktx）
    implementation 'androidx.room:room-runtime:2.5.2'
    annotationProcessor 'androidx.room:room-compiler:2.5.2'

    // 测试基础库
    testImplementation 'junit:junit:4.13.2'
    // 本地可视化校验：用真实 Skia 渲染 Zine 明信片并输出 PNG
    testImplementation 'org.robolectric:robolectric:4.13'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}